name: Revision Marketplace Juegos de Mesa

on:
  schedule:
    # 4 veces al día (8:00, 13:00, 18:00 y 22:00 hora de Guatemala)
    - cron: '0 0,4,14,19 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias y Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Ejecutar revision de Marketplace
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: |
          python main.py
          

      - name: Guardar historial de publicaciones y Excel
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Actualizar historial de publicaciones y Excel de juegos" || echo "Sin cambios"
          git push
          
