name: Revision Marketplace Juegos de Mesa

on:
  schedule:
    # 4 veces al día (8:00, 13:00, 18:00 y 22:00 hora de Guatemala)
    - cron: '0 0,4,14,19 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Cachea las ruedas de pip entre corridas (clave: requirements.txt).
          cache: pip

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      # La versión instalada de Playwright decide qué build de Chromium hace
      # falta, así que se usa como clave del caché: al actualizar Playwright
      # el caché se invalida solo y se baja el navegador correcto.
      - name: Detectar version de Playwright
        id: pw
        run: |
          echo "version=$(playwright --version | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Restaurar navegador de Playwright desde cache
        id: cache-navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Solo se descarga Chromium (~130 MB) cuando el caché falla. En un acierto
      # basta con instalar las librerías del sistema, que no se pueden cachear
      # porque son paquetes apt de la VM.
      - name: Instalar Chromium
        if: steps.cache-navegador.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Instalar librerias de sistema para Chromium
        if: steps.cache-navegador.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      # 'apt-get update' tarda más que la instalación misma, así que solo se
      # ejecuta si el índice de paquetes de la imagen resultó estar viejo.
      - name: Instalar Tesseract OCR
        run: |
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-spa \
          || { sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-spa; }

      - name: Ejecutar revision de Marketplace
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: |
          python main.py
          

      - name: Guardar historial de publicaciones y Excel
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Actualizar historial de publicaciones y Excel de juegos" || echo "Sin cambios"
          git push
          
